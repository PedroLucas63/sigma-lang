name: CI — Testes & Validação

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes & Paridade Sigma
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - name: Instalar Dependências do Sistema & Dune
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make
          opam install -y dune

      - name: Compilar Toolchain
        run: |
          cd toolchain
          opam exec -- dune build --profile release

      - name: Executar Testes Unitários OCaml
        run: |
          cd toolchain
          opam exec -- dune runtest

      - name: Executar Suíte de Testes Sigma (Paridade VM vs Compilador C99)
        run: |
          ./toolchain/_build/default/bin/main.exe test tests/ --parity
