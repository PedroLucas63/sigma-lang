name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'web/**'
      - 'editors/vscode/syntaxes/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-pages:
    name: Build GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v7.0.1

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Construir Wiki VitePress (web/)
        run: |
          cd web
          npm install
          npm run docs:build

      - name: Preparar Diretório do Site & Documentação
        run: |
          mkdir -p _site
          cp -r web/.vitepress/dist/* _site/
          mkdir -p _site/docs
          cp -r docs/* _site/docs/
          touch _site/.nojekyll

      - name: Carregar Artefatos do Site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy-pages:
    name: Deploy GitHub Pages
    needs: [build-pages]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Realizar Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
