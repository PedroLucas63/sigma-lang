<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sigma (.sgm) — Linguagem Científica de Alta Performance</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      padding: 2.5rem 2rem;
      border-bottom: 1px solid #334155;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 2.4rem; color: var(--accent); }
    header p { color: var(--muted); max-width: 680px; margin: 0.5rem auto 0; }
    main {
      max-width: 1080px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1.25rem;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    select, button {
      background: #0f172a;
      color: var(--text);
      border: 1px solid #475569;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      border: none;
    }
    textarea, pre {
      width: 100%;
      box-sizing: border-box;
      min-height: 320px;
      background: #020617;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Σ Sigma Language (<code>.sgm</code>)</h1>
    <p>Propósito geral, computação científica e estatística com tipagem forte e compilação nativa nível C/C++ (<code>-O3</code>).</p>
  </header>
  <main>
    <section class="card">
      <div class="toolbar">
        <select id="example-select">
          <option value="strings">1. Strings Interpoladas, Char Unicode e Showcase</option>
          <option value="floats">2. Float, Double e Decimal Exato de 128 bits</option>
          <option value="numbers">3. Números Grandes com '_' e Inteiros</option>
          <option value="booleans">4. Tipo Booleano (bool) e Zero-Init</option>
          <option value="typeerror">5. Erro de Tipagem Forte (E0104)</option>
        </select>
        <button class="primary" id="run-btn">Simular Saída</button>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
    </section>
    <section class="card">
      <div class="toolbar">
        <strong>Saída (<code>sigma run</code> / <code>sigma build</code>)</strong>
      </div>
      <pre id="output"></pre>
    </section>
  </main>
  <script>
    const examples = {
      strings: {
        code: `// Char Unicode UTF-8 e Strings com Interpolação \${...}\nvar simbolo : char = 'Σ';\nvar foguete := '🚀';\nvar linguagem := "Sigma";\nvar iteracoes := 1_000_000;\nvar erro : double = 0.0001d;\nvar ok := true;\n\nvar resumo := "[\${simbolo}] \${linguagem} \${foguete}: iter=\${iteracoes}, erro=\${erro}, ok=\${ok}";\n\nsimbolo;\nfoguete;\nresumo;`,
        out: `Σ\n🚀\n[Σ] Sigma 🚀: iter=1000000, erro=0.0001, ok=true`
      },
      floats: {
        code: `// float (32-bit), double (64-bit, 'd') e decimal (128-bit exato, 'm')\nvar f1 := 10.5;\nvar f2 : float = 1.5e2;\nvar d1 : double = 3.141592653589793d;\nvar m1 : decimal = 123_456.789_012_345_678_901_234_567_89m;\nvar m_zero : decimal;\n\nf1;\nf2;\nd1;\nm1;\nm_zero;`,
        out: `10.5\n150.0\n3.141592653589793\n123456.78901234567890123456789\n0.0`
      },
      numbers: {
        code: `// Separador estrito de dígitos (_) em literais int64\nvar m1 := 1000000;\nvar m2 := 1_000_000;\nvar m3 : int = 10_00_00_00;\nvar zero : int;\n\nm1;\nm2;\nm3;\nzero;`,
        out: `1000000\n1000000\n10000000\n0`
      },
      booleans: {
        code: `// Tipo booleano (bool) com inferência e zero-init = false\nvar convergiu := true;\nvar verbose : bool = false;\nvar padrao : bool;\nvar copia : bool = convergiu;\n\nconvergiu;\nverbose;\npadrao;\ncopia;`,
        out: `true\nfalse\nfalse\ntrue`
      },
      typeerror: {
        code: `// Tipagem forte: sem coerção implícita entre float e double\nvar a : double = 10.0;\nvar b : string = 'Σ';`,
        out: `error[E0104]: type mismatch: expected 'double', found 'float'\n  --> playground.sgm:2:18\n  2 | var a : double = 10.0;\n    |                  ^^^^\n  = hint: Sigma is strongly typed: cannot assign value of type 'float' to variable 'a' of type 'double'`
      }
    };
    const select = document.getElementById('example-select');
    const editor = document.getElementById('editor');
    const output = document.getElementById('output');
    function loadExample(key) {
      editor.value = examples[key].code;
      output.textContent = examples[key].out;
    }
    select.addEventListener('change', (e) => loadExample(e.target.value));
    document.getElementById('run-btn').addEventListener('click', () => {
      output.textContent = examples[select.value].out;
    });
    loadExample('strings');
  </script>
</body>
</html>
